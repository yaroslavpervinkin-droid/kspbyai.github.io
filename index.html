function rsz(){cv.width=innerWidth;cv.height=innerHeight;bv.width=innerWidth-260;bv.height=innerHeight-50}rsz();addEventListener('resize',rsz);
const PI=Math.PI,TAU=PI*2;
const kerbin={name:'Kerbin',R:600000,mu:3.5316e12,atmoH:70000,atmoD:1.225,rotP:21549,x:0,y:0,seed:42,parent:null,col:'#3a7830',ocol:'#4477cc'};
const mun={name:'Mun',R:200000,mu:6.5138e10,atmoH:0,orbR:12e6,orbV:542.5,soi:2429559,ang:0,x:12e6,y:0,seed:137,parent:kerbin,rotP:138984,col:'#888',ocol:'#aaa'};
const minmus={name:'Minmus',R:60000,mu:1.766e9,atmoH:0,orbR:47e6,orbV:274.1,soi:2247428,ang:2.5,x:0,y:0,seed:89,parent:kerbin,rotP:40400,col:'#6aaa98',ocol:'#8bc'};
const allBodies=[kerbin,mun,minmus],bodyMap={kerbin,mun,minmus};
function initBodies(){for(let b of allBodies)if(b.parent&&b.orbR){b.x=b.parent.x+Math.cos(b.ang)*b.orbR;b.y=b.parent.y+Math.sin(b.ang)*b.orbR;}}initBodies();
function updateBodies(dt){for(let b of allBodies){if(!b.parent||!b.orbR)continue;b.ang+=b.orbV/b.orbR*dt;b.x=b.parent.x+Math.cos(b.ang)*b.orbR;b.y=b.parent.y+Math.sin(b.ang)*b.orbR;}}
function bodyVel(b){if(!b.parent||!b.orbR)return{vx:0,vy:0};return{vx:-Math.sin(b.ang)*b.orbV,vy:Math.cos(b.ang)*b.orbV};}
function surfVel(bd,sa,dist){let v=bodyVel(bd),rs=TAU*dist/(bd.rotP||1e15);return{vx:v.vx-Math.sin(sa)*rs,vy:v.vy+Math.cos(sa)*rs};}
function terrainH(body,a){let s=body.seed,h=Math.sin(a*5+s*1.1)*300+Math.sin(a*11+s*2.3)*150+Math.sin(a*23+s*3.7)*80+Math.sin(a*47+s*5.1)*40+Math.sin(a*97+s*7.3)*20+Math.sin(a*199+s*11.7)*10;if(body===kerbin){h*=2.5;h+=Math.max(0,Math.sin(a*3+s*.7)*1500-700)+Math.max(0,Math.sin(a*7+s*1.3)*800-400);}if(body===mun){h*=5;h+=Math.max(0,Math.sin(a*4+s)*1200-600);}if(body===minmus)h*=1.5;return Math.max(0,h);}
function surfaceH(body,a){return body.R+terrainH(body,a)}
function findSOI(x,y){if(gD(x,y,mun)<mun.soi)return mun;if(gD(x,y,minmus)<minmus.soi)return minmus;return kerbin;}
function getAlt(x,y,bd){bd=bd||curBody;return Math.sqrt((x-bd.x)**2+(y-bd.y)**2)-bd.R}
function gD(x,y,bd){return Math.sqrt((x-bd.x)**2+(y-bd.y)**2)}
function atmoD(alt){if(curBody!==kerbin||alt>kerbin.atmoH||alt<0)return 0;return kerbin.atmoD*Math.exp(-alt/(kerbin.atmoH/5));}
function totalGrav(x,y){let ax=0,ay=0;for(let bd of allBodies){let dx=bd.x-x,dy=bd.y-y,r2=dx*dx+dy*dy,r=Math.sqrt(r2);if(r<100)r=100;let f=bd.mu/r2;ax+=f*dx/r;ay+=f*dy/r;}return{ax,ay};}

function updateConsPanel(){let panel=document.getElementById('consumption-panel');if(!ship||dead||mode!=='flight'){panel.innerHTML='';return;}let engs=aEngs(),tT=0,tFR=0,tF=0,tFM=0,mass=sMass();for(let e of engs){if(e.d.c==='srb'){if(e.fuel>0){tT+=e.d.T;tFR+=e.maxFuel/(e.d.bt||10);}}else{tT+=e.d.T;tFR+=e.d.T/(e.d.isp*9.81);}}for(let p of ship.p){if(p.sep||p.st>ship.st||!p.d)continue;if((p.d.c==='fuel'&&!p.d.isMono)||p.d.c==='srb'){tF+=p.fuel;tFM+=p.maxFuel;}}let bT=(tFR*ship.th)>0?tF/(tFR*ship.th):Infinity;let aI=0,ic=0;for(let e of engs){if(e.d.isp){aI+=e.d.isp;ic++;}}if(ic)aI/=ic;let dM=ship.p.filter(p=>!p.sep).reduce((s,p)=>s+(p.d?(p.d.fu!==undefined?(p.d.dm||p.d.m*.1):p.d.m):0),0);let dv=aI>0?aI*9.81*Math.log(mass/Math.max(dM,1)):0;let fp=tFM>0?Math.round(tF/tFM*100):0;let en=elecProd-elecDrain;panel.innerHTML='<div class="panel" style="min-width:160px;padding:7px 10px;font-size:11px"><span class="pl">Тяга:</span><span class="pv">'+(tT/1000).toFixed(1)+'кН</span> <span class="pl">ΔV:</span><span class="pv">'+dv.toFixed(0)+'</span><br><span class="pl">Топл:</span><span class="pv">'+fp+'%</span> <span class="pl">Гор:</span><span class="pv">'+fTime(bT)+'</span><br><span class="pl">⚡</span><span class="pv" style="color:'+(en>=0?'#4c5':'#f55')+'">'+(en>=0?'+':'')+en.toFixed(2)+'/с</span></div>';}

bv.addEventListener('mousedown',ev=>{let pos=b2w(ev.clientX,ev.clientY);if(ev.button===1||ev.button===2||(ev.button===0&&ev.shiftKey)){ev.preventDefault();bPanDrag={sx:ev.clientX,sy:ev.clientY,cx:bCam.x,cy:bCam.y};return;}if(ev.button===0&&!bDrag){let f=-1;for(let i=bp.length-1;i>=0;i--){let p=bp[i],d=P[p.t];if(Math.abs(pos.x-p.x)<d.w/2+.1&&Math.abs(pos.y-p.y)<d.h/2+.1){f=i;break;}}if(f>=0){bSel=f;sBP();bDrag={idx:f,ox:pos.x-bp[f].x,oy:pos.y-bp[f].y,panel:false};}else bSel=-1;}});bv.addEventListener('contextmenu',ev=>ev.preventDefault());

function b2w(sx,sy){let r=bv.getBoundingClientRect();return{x:(sx-r.left-bv.width/2)/bCam.z+bCam.x,y:(sy-r.top-bv.height/2)/bCam.z+bCam.y};}function sn(v,g){return Math.round(v/g)*g}function chkO(nx,ny,def,si){for(let i=0;i<bp.length;i++){if(i===si)continue;let p=bp[i],d=P[p.t];if(Math.abs(nx-p.x)<(def.w+d.w)/2-.08&&Math.abs(ny-p.y)<(def.h+d.h)/2-.08)return true;}return false;}

function drawPart(ctx,px,py,def,sc,sel,fr,fo,th,co,lo,rF){ctx.save();ctx.translate(px,py);let w=def.w*sc,h=def.h*sc,hw=w/2,hh=h/2;if(sel){ctx.strokeStyle='rgba(94,184,255,.6)';ctx.lineWidth=.07*sc;ctx.setLineDash([.15*sc,.1*sc]);ctx.strokeRect(-hw-.1*sc,-hh-.1*sc,w+.2*sc,h+.2*sc);ctx.setLineDash([]);}
if(def.sh==='cap'){ctx.fillStyle=def.cl;ctx.beginPath();ctx.moveTo(-hw,hh);ctx.lineTo(-hw,-hh*.2);ctx.quadraticCurveTo(-hw,-hh-hw*.4,0,-hh-hw*.55);ctx.quadraticCurveTo(hw,-hh-hw*.4,hw,-hh*.2);ctx.lineTo(hw,hh);ctx.closePath();ctx.fill();ctx.fillStyle='#3a7acc';ctx.beginPath();ctx.arc(0,-hh*.15,hw*.22,0,TAU);ctx.fill();}
else if(def.sh==='cyl'){ctx.fillStyle=def.cl;ctx.beginPath();ctx.roundRect(-hw,-hh,w,h,.04*sc);ctx.fill();if(fr!==undefined){ctx.fillStyle=`rgba(60,200,120,${.15+fr*.15})`;ctx.fillRect(-hw+.03*sc,-hh+h*(1-fr)+.03*sc,w-.06*sc,h*fr-.06*sc);}}
else if(def.sh==='eng'){ctx.fillStyle=def.cl;ctx.fillRect(-hw*.65,-hh,hw*1.3,h*.4);ctx.fillStyle='#444';ctx.beginPath();ctx.moveTo(-hw*.45,-hh+h*.4);ctx.lineTo(-hw*.85,hh);ctx.lineTo(hw*.85,hh);ctx.lineTo(hw*.45,-hh+h*.4);ctx.closePath();ctx.fill();if(fo&&th>0){let fw=(def.fw||.5)*sc,fh=(def.fh||2)*sc*(.7+Math.random()*.5)*th;let fg=ctx.createLinearGradient(0,hh,0,hh+fh);fg.addColorStop(0,'rgba(255,255,255,.95)');fg.addColorStop(.3,'rgba(255,200,60,.8)');fg.addColorStop(1,'rgba(200,0,0,0)');ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(-fw/2,hh);ctx.quadraticCurveTo(0,hh+fh*.7,0,hh+fh);ctx.quadraticCurveTo(0,hh+fh*.7,fw/2,hh);ctx.closePath();ctx.fill();}}

function buildShip(){if(!bp.length)preset('light');let sorted=[...bp].sort((a,b)=>a.y-b.y);let stMap=new Map(),stN=0,decIs=[];for(let i=0;i<sorted.length;i++)if(P[sorted[i].t].dec)decIs.push(i);let last=sorted.length;for(let d=decIs.length-1;d>=0;d--){let di=decIs[d];for(let i=di;i<last;i++)stMap.set(i,stN);last=di;stN++;}for(let i=0;i<last;i++)stMap.set(i,stN);let minY=Infinity,maxY=-Infinity;for(let p of sorted){let d=P[p.t];minY=Math.min(minY,p.y-d.h/2);maxY=Math.max(maxY,p.y+d.h/2);}let cY=(minY+maxY)/2,tH=maxY-minY;let sp=[];for(let i=0;i<sorted.length;i++){let p=sorted[i],d=P[p.t];sp.push({t:p.t,d,lx:p.x,ly:p.y-cY,st:stMap.get(i)||0,fuel:d.fu||0,maxFuel:d.fu||0,sep:false});}let mx=Math.max(...sp.map(p=>p.st));let sA=KSC_ANG,sR=surfaceH(kerbin,sA)+tH/2+5;return{p:sp,x:kerbin.x+Math.cos(sA)*sR,y:kerbin.y+Math.sin(sA)*sR,vx:0,vy:0,a:0,av:0,th:0,st:-1,ms:mx,tH,gF:0};}
function sMass(){if(!ship)return 1;let m=0;for(let p of ship.p){if(p.sep)continue;let d=p.d;if(!d)continue;m+=d.fu!==undefined?(d.dm||d.m*.1)+p.fuel:d.m;}return Math.max(m,1);}
function aEngs(){return ship?ship.p.filter(p=>!p.sep&&p.d&&(p.d.c==='eng'||p.d.c==='srb')&&p.st<=ship.st):[];}
function aFuel(){let t=0;for(let p of ship.p){if(p.sep||!p.d||p.d.c!=='fuel'||p.d.isMono||p.fuel<=0||p.st>ship.st)continue;t+=p.fuel;}return t;}
function useFuel(a){if(infFuel)return true;let tanks=ship.p.filter(p=>!p.sep&&p.d&&p.d.c==='fuel'&&!p.d.isMono&&p.fuel>0&&p.st<=ship.st).sort((a,b)=>a.st-b.st);let rem=a;for(let t of tanks){let tk=Math.min(rem,t.fuel);t.fuel-=tk;rem-=tk;if(rem<=0)return true;}return rem<=0;}
function doStage(){if(!ship||dead||ship.st>=ship.ms)return;ship.st++;for(let p of ship.p){if(p.sep||!p.d)continue;if(p.d.dec&&p.st===ship.st){let sp=ship.p.filter(q=>!q.sep&&q.st<ship.st);let hasCmd=sp.some(q=>q.d&&q.d.c==='cmd');if(hasCmd){let sepParts=sp.map(q=>({t:q.t,lx:q.lx,ly:q.ly,st:0,fuel:q.fuel,maxFuel:q.maxFuel,sep:false}));let sepShip={x:ship.x,y:ship.y,vx:ship.vx-Math.sin(ship.a)*2,vy:ship.vy+Math.cos(ship.a)*2,a:ship.a,av:0,th:0,st:0,ms:0,tH:2,gF:0,p:sepParts};allShips.push({ship:sepShip,curBody:curBody.name,landed:false,dead:false,name:'Мод-'+(allShips.length+1),launchTime:gameT});let maxR=0,isR=false;for(let q of sp){if(q.d&&q.d.range)maxR=Math.max(maxR,q.d.range);if(q.d&&q.d.isRelay)isR=true;}if(maxR>0)satellites.push({x:ship.x,y:ship.y,vx:ship.vx,vy:ship.vy,relay:isR,range:maxR,name:(isR?'Ретр':'Сп')+'-'+(satellites.length+1),mass:100});}for(let q of ship.p)if(!q.sep&&q.st<ship.st){q.sep=true;debris.push({x:ship.x,y:ship.y,vx:ship.vx+(Math.random()-.5)*10,vy:ship.vy+(Math.random()-.5)*10,w:.5,h:.5,cl:q.d?q.d.cl:'#888',life:120});}p.sep=true;}}}

function checkCollisions(){if(!ship||dead||landed)return;for(let si=0;si<allShips.length;si++){if(si===activeShipIndex)continue;let sd=allShips[si];if(!sd||!sd.ship||sd.dead||sd.landed)continue;let os=sd.ship,dx=ship.x-os.x,dy=ship.y-os.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist>200)continue;let docked=false;for(let p1 of ship.p){if(p1.sep||!p1.d||p1.d.dockSize===undefined)continue;let wx1=ship.x+(Math.cos(ship.a)*p1.lx-Math.sin(ship.a)*p1.ly)*10,wy1=ship.y+(Math.sin(ship.a)*p1.lx+Math.cos(ship.a)*p1.ly)*10;for(let p2 of os.p){if(p2.sep)continue;let d2=p2.d||P[p2.t];if(!d2||d2.dockSize===undefined||d2.dockSize!==p1.d.dockSize)continue;let wx2=os.x+(Math.cos(os.a)*p2.lx-Math.sin(os.a)*p2.ly)*10,wy2=os.y+(Math.sin(os.a)*p2.lx+Math.cos(os.a)*p2.ly)*10;if(Math.sqrt((wx1-wx2)**2+(wy1-wy2)**2)<(p1.d.w+d2.w)*6){let rv=Math.sqrt((ship.vx-os.vx)**2+(ship.vy-os.vy)**2);if(rv<15){performDock(si);docked=true;break;}}}if(docked)break;}if(docked)continue;if(dist<80){let rv=Math.sqrt((ship.vx-os.vx)**2+(ship.vy-os.vy)**2);if(rv>30&&!godMode){boom();sd.dead=true;return;}if(dist>5){let nx=dx/dist,ny=dy/dist,m1=sMass(),dvn=(ship.vx-os.vx)*nx+(ship.vy-os.vy)*ny;if(dvn>=0)continue;let j=-(1+.3)*dvn/(1/m1+1/100);ship.vx+=j*nx/m1;ship.vy+=j*ny/m1;os.vx-=j*nx/100;os.vy-=j*ny/100;ship.x+=nx*5;ship.y+=ny*5;os.x-=nx*5;os.y-=ny*5;}}}}
function performDock(ti){let td=allShips[ti];if(!td||!td.ship)return;let os=td.ship;if(!os.p[0]||!os.p[0].d)for(let p of os.p)p.d=P[p.t];let m1=sMass(),m2=1;for(let p of os.p)if(!p.sep){let d=p.d||P[p.t];if(d)m2+=d.fu!==undefined?(d.dm||d.m*.1)+(p.fuel||0):d.m;}ship.vx=(ship.vx*m1+os.vx*m2)/(m1+m2);ship.vy=(ship.vy*m1+os.vy*m2)/(m1+m2);let da=os.a-ship.a,dx=os.x-ship.x,dy=os.y-ship.y,cosA=Math.cos(-ship.a),sinA=Math.sin(-ship.a),rlx=(dx*cosA-dy*sinA)/10,rly=(dx*sinA+dy*cosA)/10;for(let p of os.p){if(p.sep)continue;ship.p.push({t:p.t,d:P[p.t],lx:p.lx*Math.cos(da)-p.ly*Math.sin(da)+rlx,ly:p.lx*Math.sin(da)+p.ly*Math.cos(da)+rly,st:ship.ms+1,fuel:p.fuel||0,maxFuel:p.maxFuel||0,sep:false});}ship.ms++;allShips.splice(ti,1);if(activeShipIndex>ti)activeShipIndex--;for(let i=0;i<20;i++){let a=Math.random()*TAU;expParts.push({x:ship.x,y:ship.y,vx:Math.cos(a)*20+ship.vx,vy:Math.sin(a)*20+ship.vy,life:.5+Math.random(),sz:1+Math.random()*2,cl:'#4f4'});}}

function physics(dt){if(!ship||dead)return;let warp=WARP[warpI],eDt=dt*warp;gameT+=eDt;let spd=Math.sqrt(ship.vx**2+ship.vy**2);let steps=Math.max(1,Math.ceil(warp));if(spd>500)steps=Math.max(steps,Math.ceil(spd*eDt/20000));steps=Math.min(steps,2000);let sdt=eDt/steps;
for(let s=0;s<steps;s++){updateBodies(sdt);
for(let si=0;si<allShips.length;si++){if(si===activeShipIndex)continue;let sd=allShips[si];if(!sd||!sd.ship||sd.dead)continue;let ss=sd.ship;if(!sd.landed){let g=totalGrav(ss.x,ss.y);ss.vx+=g.ax*sdt;ss.vy+=g.ay*sdt;ss.x+=ss.vx*sdt;ss.y+=ss.vy*sdt;let sb=findSOI(ss.x,ss.y),dd=gD(ss.x,ss.y,sb),sa2=Math.atan2(ss.y-sb.y,ss.x-sb.x),sr2=surfaceH(sb,sa2);if(dd<=sr2+3){sd.landed=true;let sv2=surfVel(sb,sa2,sr2+4);ss.x=sb.x+Math.cos(sa2)*(sr2+4);ss.y=sb.y+Math.sin(sa2)*(sr2+4);ss.vx=sv2.vx;ss.vy=sv2.vy;ss.a=sa2+PI/2;}sd.curBody=sb.name;}else{let sb=bodyMap[sd.curBody]||kerbin,sa2=Math.atan2(ss.y-sb.y,ss.x-sb.x),sr2=surfaceH(sb,sa2);sa2+=TAU/(sb.rotP||1e15)*sdt;ss.x=sb.x+Math.cos(sa2)*(sr2+4);ss.y=sb.y+Math.sin(sa2)*(sr2+4);let sv2=surfVel(sb,sa2,sr2+4);ss.vx=sv2.vx;ss.vy=sv2.vy;ss.a=sa2+PI/2;}}
for(let sat of satellites){let g=totalGrav(sat.x,sat.y);sat.vx+=g.ax*sdt;sat.vy+=g.ay*sdt;sat.x+=sat.vx*sdt;sat.y+=sat.vy*sdt;}
curBody=findSOI(ship.x,ship.y);let mass=sMass(),alt=getAlt(ship.x,ship.y),gr=totalGrav(ship.x,ship.y);
let canT=!elecDead,tTotal=0,engs=aEngs();for(let e of engs){if(e.d.c==='srb'){if(e.fuel>0){tTotal+=e.d.T;if(!infFuel)e.fuel=Math.max(0,e.fuel-e.maxFuel/(e.d.bt||10)*sdt*ship.th);}}else if(canT&&aFuel()>0){tTotal+=e.d.T;useFuel(e.d.T/(e.d.isp*9.81)*sdt*ship.th);}}

c.fillStyle='#5eb8ff';c.beginPath();c.arc(ship.x,ship.y,7/mz,0,TAU);c.fill();}
c.restore();c.fillStyle='rgba(255,255,255,.2)';c.font='11px sans-serif';c.textAlign='center';c.fillText('ПКМ/Shift+ЛКМ перемещение · Колесо зум',cv.width/2,cv.height-15);}

function renderBuild(){b.fillStyle='#080c14';b.fillRect(0,0,bv.width,bv.height);b.save();b.translate(bv.width/2,bv.height/2);b.scale(bCam.z,bCam.z);b.translate(-bCam.x,-bCam.y);b.strokeStyle='rgba(255,255,255,.035)';b.lineWidth=.015;let gs=.5,vw=bv.width/bCam.z,vh=bv.height/bCam.z;let sx=Math.floor((bCam.x-vw/2)/gs)*gs;for(let gx=sx;gx<bCam.x+vw/2;gx+=gs){b.beginPath();b.moveTo(gx,bCam.y-vh/2);b.lineTo(gx,bCam.y+vh/2);b.stroke();}let sy=Math.floor((bCam.y-vh/2)/gs)*gs;for(let gy=sy;gy<bCam.y+vh/2;gy+=gs){b.beginPath();b.moveTo(bCam.x-vw/2,gy);b.lineTo(bCam.x+vw/2,gy);b.stroke();}b.strokeStyle='rgba(255,255,255,.08)';b.lineWidth=.025;b.beginPath();b.moveTo(0,bCam.y-vh/2);b.lineTo(0,bCam.y+vh/2);b.stroke();for(let i=0;i<bp.length;i++){let p=bp[i],d=P[p.t];drawPart(b,p.x,p.y,d,1,i===bSel);}b.restore();let info='';if(bSel>=0&&bp[bSel]){let d=P[bp[bSel].t];info=`<span style="color:#5eb8ff;font-weight:700">${d.n}</span><br><span class="pl">Масса:</span><span class="pv">${d.m}кг</span>`;}else{let tm=0,pc=0,tT=0;for(let p of bp){let d=P[p.t];tm+=d.fu?(d.dm||d.m*.1)+d.fu:d.m;pc++;if(d.T)tT+=d.T;}info=`<span class="pl">Деталей:</span><span class="pv">${pc}</span> <span class="pl">Масса:</span><span class="pv">${(tm/1000).toFixed(2)}т</span><br><span class="pl">Тяга:</span><span class="pv">${(tT/1000).toFixed(1)}кН</span>`;}document.getElementById('binfo').innerHTML=info;}

function updateDockHUD(){let p=document.getElementById('dock-hud');if(!ship||dead||mode!=='flight'){p.innerHTML='';return;}let cl=null,cd=Infinity;for(let si=0;si<allShips.length;si++){if(si===activeShipIndex)continue;let sd=allShips[si];if(!sd||!sd.ship||sd.dead)continue;let d=Math.sqrt((sd.ship.x-ship.x)**2+(sd.ship.y-ship.y)**2);if(d<cd&&d<2000){cd=d;cl={sd,si,d};}}if(!cl){p.innerHTML='';return;}let os=cl.sd.ship,rv=Math.sqrt((ship.vx-os.vx)**2+(ship.vy-os.vy)**2);p.innerHTML=`<div class="panel" style="min-width:130px;border-color:rgba(100,255,100,.2)"><div style="font-size:10px;color:rgba(100,255,100,.5)">🔗 ${cl.sd.name}</div><div class="pd"></div><span class="pl">Дист:</span><span class="pv" style="color:${cd<100?'#4c5':'#f55'}">${fD(cd)}</span><br><span class="pl">Δv:</span><span class="pv" style="color:${rv<10?'#4c5':'#f55'}">${rv.toFixed(1)}м/с</span></div>`;}

let mouseX=0,mouseY=0;cv.addEventListener('mousemove',ev=>{mouseX=ev.clientX;mouseY=ev.clientY;});
function updateTooltip(){if(mode!=='flight'||!ship||dead){tooltip.style.display='none';return;}let z=cam.z,cx=cv.width/2,cy=cv.height/2;let wx=(mouseX-cx)/z+cam.x,wy=(mouseY-cy)/z+cam.y,dx=wx-ship.x,dy=wy-ship.y;let cosA=Math.cos(-ship.a),sinA=Math.sin(-ship.a),lx=(dx*cosA-dy*sinA)/10,ly=(dx*sinA+dy*cosA)/10;let found=null;for(let p of ship.p){if(p.sep||!p.d)continue;if(Math.abs(lx-p.lx)<p.d.w/2+.15&&Math.abs(ly-p.ly)<p.d.h/2+.15){found=p;break;}}if(found){let d=found.d,t=`<span style="color:#5eb8ff;font-weight:700">${d.n}</span><br>`;if(d.fu!==undefined)t+=`⛽ ${Math.round(found.fuel)}/${found.maxFuel}<br>`;if(d.rcsT)t+=`💨 ${d.rcsT}Н<br>`;if(d.T)t+=`🔥 ${(d.T/1000).toFixed(1)}кН<br>`;tooltip.innerHTML=t;tooltip.style.display='block';tooltip.style.left=Math.min(mouseX+15,innerWidth-230)+'px';tooltip.style.top=Math.min(mouseY+15,innerHeight-120)+'px';}else tooltip.style.display='none';}

function updateHUD(){if(!ship)return;let alt=getAlt(ship.x,ship.y),mass=sMass(),dx=ship.x-curBody.x,dy=ship.y-curBody.y,dist=Math.sqrt(dx*dx+dy*dy),sa=Math.atan2(dy,dx),sv=surfVel(curBody,sa,dist),sSpd=Math.sqrt((ship.vx-sv.vx)**2+(ship.vy-sv.vy)**2),bv2=bodyVel(curBody),orbSpd=Math.sqrt((ship.vx-bv2.vx)**2+(ship.vy-bv2.vy)**2);
let rd={x:dx/dist,y:dy/dist},vSpd=(ship.vx-sv.vx)*rd.x+(ship.vy-sv.vy)*rd.y;
let pts=computeOrbitPath(curBody,100),pe=pts.pe?pts.pe.alt:0,ap=pts.ap?pts.ap.alt:Infinity,ecc=pts.ecc||0,period=pts.period||Infinity;
let tT=0;for(let e of aEngs()){if(e.d.c==='srb'&&e.fuel>0)tT+=e.d.T;else if(e.d.c==='eng'&&aFuel()>0)tT+=e.d.T;}
let lg=curBody.mu/(dist*dist),twr=mass>0?(tT*ship.th)/(mass*lg):0;
let sname=(activeShipIndex>=0&&allShips[activeShipIndex])?allShips[activeShipIndex].name:'Корабль';
let sig=getSignalStrength(),delay=getSignalDelay();
document.getElementById('h1').innerHTML=`<div style="font-weight:700;color:#5eb8ff">☊ ${curBody.name} — ${sname}</div><div class="pd"></div><span class="pl">Выс</span><span class="pv">${fD(alt)}</span> <span class="pl">V↕</span><span class="pv">${vSpd>0?'▲':'▼'}${fS(Math.abs(vSpd))}</span><br><span class="pl">Орб</span><span class="pv">${fS(orbSpd)}</span> <span class="pl">Пов</span><span class="pv">${fS(sSpd)}</span><br><div class="pd"></div><span class="pl">TWR</span><span class="pv">${twr.toFixed(2)}</span> <span class="pl">G</span><span class="pv">${(ship.gF||0).toFixed(1)}</span><br>${rcsOn?'<span style="color:#5af">💨РСУ</span> ':''}${sasOn?'<span style="color:#4c5">●SAS</span> ':''}${landed?'<span style="color:#4c5">▪ПОС</span>':'<span style="color:#fa0">▪ПОЛ</span>'}${dead?'<br><span style="color:#f44">✖ КРУШЕНИЕ [R]</span>':''}`;
document.getElementById('h2').innerHTML=`<span class="pl">Ap</span><span class="pv">${fD(ap)}</span> <span class="pl">Pe</span><span class="pv">${fD(pe)}</span><br><span class="pl">Ecc</span><span class="pv">${ecc.toFixed(4)}</span> <span class="pl">T</span><span class="pv">${fTime(period)}</span><br><div class="pd"></div><span class="pl">×</span><span class="pv">${fWarp(WARP[warpI])}</span><br><span class="pl">📡</span><span class="pv">${Math.round(sig*100)}%</span>${delay>0.01?` <span class="pl">задержка</span><span class="pv">${delay.toFixed(1)}с</span>`:''}`;
let tp2=Math.round(ship.th*100);document.getElementById('tp').textContent=tp2+'%';let tf=document.getElementById('thr-fill');tf.style.width=tp2+'%';tf.style.background=tp2>80?'#f59e0b':(tp2>0?'#22c55e':'#444');let wd=document.getElementById('warp-bar');if(warpI>0){wd.style.display='block';document.getElementById('wv').textContent=fWarp(WARP[warpI]);}else wd.style.display='none';
let bars=Math.ceil(sig*5),bs='';for(let i=0;i<5;i++)bs+=i<bars?'<span style="color:#4c5">▮</span>':'<span style="color:#333">▮</span>';document.getElementById('comm-panel').innerHTML=`<div class="panel" style="min-width:auto;padding:6px 10px;font-size:11px">📡${bs}${delay>1?'<br><span style="color:#fa0;font-size:10px">'+delay.toFixed(1)+'с</span>':''}</div>`;document.getElementById('return-vab-btn').style.display=(mode==='flight'&&ship&&!dead)?'block':'none';}

function fD(m){if(!isFinite(m))return'∞';if(m<0)return'-'+fD(-m);if(m>=1e6)return(m/1e6).toFixed(1)+'Мм';if(m>=1e3)return(m/1e3).toFixed(1)+'км';return m.toFixed(0)+'м'}
function fS(ms){return ms>=1e3?(ms/1e3).toFixed(2)+'км/с':ms.toFixed(1)+'м/с'}
function fTime(s){if(!isFinite(s))return'∞';let d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);if(d>0)return d+'д'+h+'ч';if(h>0)return h+'ч'+m+'м';if(m>0)return m+'м'+Math.floor(s%60)+'с';return Math.floor(s)+'с'}
function fWarp(w){return w>=1e6?(w/1e6|0)+'M':w>=1e3?(w/1e3|0)+'K':''+w;}

cv.addEventListener('mousedown',ev=>{if(mode==='map'&&(ev.button===2||ev.button===1||(ev.button===0&&ev.shiftKey))){ev.preventDefault();mapDrag={sx:ev.clientX,sy:ev.clientY,cx:mapCamX,cy:mapCamY};}});
cv.addEventListener('mousemove',ev=>{if(mapDrag&&mode==='map'){mapCamX=mapDrag.cx-(ev.clientX-mapDrag.sx)/cam.mz;mapCamY=mapDrag.cy-(ev.clientY-mapDrag.sy)/cam.mz;}});
cv.addEventListener('mouseup',()=>{mapDrag=null;});
cv.addEventListener('contextmenu',ev=>{if(mode==='map')ev.preventDefault();});

document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(k===' '){e.preventDefault();if(mode==='flight')doStage();}if(k==='t'&&mode==='flight'&&!elecDead)sasOn=!sasOn;if(k==='g'&&mode==='flight')gearOut=!gearOut;if(k==='p'&&mode==='flight'&&ship&&ship.p.some(p=>!p.sep&&p.d&&p.d.chute))chuteOn=!chuteOn;if(k==='n'&&mode==='flight')rcsOn=!rcsOn;if(k==='z'&&ship)ship.th=1;if(k==='x'&&ship)ship.th=0;if(k==='r')resetFlight();if(k==='m'){setMode(mode==='map'?'flight':'map');if(mode==='map'){mapCamX=curBody.x;mapCamY=curBody.y;}}if(k==='b')setMode(mode==='build'?'flight':'build');if(k==='v'&&mode==='flight')returnToVAB();if(k==='h')toggleShipsPanel();if(k==='.'||k==='>')warpI=Math.min(warpI+1,WARP.length-1);if(k===','||k==='<')warpI=Math.max(warpI-1,0);if(k==='='||k==='+'){if(mode==='map')cam.mz*=1.5;else cam.tz=Math.min(cam.tz*1.3,40);}if(k==='-'||k==='_'){if(mode==='map')cam.mz/=1.5;else cam.tz=Math.max(cam.tz/1.3,.00005);}if(mode==='build'&&(k==='delete'||k==='backspace')){e.preventDefault();delSel();}if(e.key==='F12'){e.preventDefault();toggleCheat();}if(k>='1'&&k<='9'&&mode==='flight'){let idx=parseInt(k)-1;if(idx<allShips.length)switchShip(idx);}});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();if(mode==='map')cam.mz*=e.deltaY>0?.8:1.25;else{cam.tz*=e.deltaY>0?.85:1.18;cam.tz=Math.max(.00005,Math.min(40,cam.tz));}});

function handleInput(dt){if(!ship||dead||mode!=='flight')return;if(keys.w||keys['ц'])ship.th=Math.min(1,ship.th+dt*.6);if(keys.s||keys['ы'])ship.th=Math.max(0,ship.th-dt*.6);if(keys.a||keys['ф'])ship.av-=dt*2;if(keys.d||keys['в'])ship.av+=dt*2;rcsInput={tx:0,ty:0,rot:0};if(rcsOn&&hasRCS()){if(keys.j||keys['о'])rcsInput.tx=-1;if(keys.l||keys['д'])rcsInput.tx=1;if(keys.i||keys['ш'])rcsInput.ty=-1;if(keys.k||keys['л'])rcsInput.ty=1;if(keys.q||keys['й'])rcsInput.rot=-1;if(keys.e||keys['у'])rcsInput.rot=1;}}

function setMode(m){mode=m;document.getElementById('build-ui').style.display=m==='build'?'block':'none';if(m==='build'){setupBP();bCam={x:0,y:0,z:35};}document.querySelectorAll('.mb').forEach((b,i)=>b.classList.toggle('on',['flight','map','build'][i]===m));let show=m!=='build';['ui-top-left','ui-top-right','ui-bottom','ui-bottom-right','stage-btn','navball-container','comm-panel','consumption-panel','active-ships-panel','return-vab-btn','dock-hud','toggle-ships-btn','soi-indicator'].forEach(id=>{let el=document.getElementById(id);if(el)el.style.display=show?'':'none';});if(m!=='flight')tooltip.style.display='none';}

function launch(){if(!bp.length)return;if(ship&&activeShipIndex>=0)saveShip();let ns=buildShip();dead=false;landed=true;chuteOn=false;rcsOn=false;curBody=kerbin;cam.tz=1.5;warpI=0;debris=[];expParts=[];trail=[];exhaustParticles=[];ship=ns;elecCharge=0;elecMaxCharge=0;for(let p of ship.p)if(p.d&&p.d.elecCap){elecCharge+=p.d.elecCap;elecMaxCharge+=p.d.elecCap;}allShips.push({ship,curBody:'kerbin',landed:true,dead:false,name:'Корабль-'+(allShips.length+1),launchTime:gameT});activeShipIndex=allShips.length-1;cam.x=ship.x;cam.y=ship.y;setMode('flight');}

function resetFlight(){if(!bp.length)preset('light');allShips=[];activeShipIndex=-1;satellites=[];ship=buildShip();dead=false;landed=true;chuteOn=false;rcsOn=false;curBody=kerbin;cam.tz=1.5;cam.x=ship.x;cam.y=ship.y;warpI=0;debris=[];expParts=[];trail=[];exhaustParticles=[];elecCharge=0;elecMaxCharge=0;for(let p of ship.p)if(p.d&&p.d.elecCap){elecCharge+=p.d.elecCap;elecMaxCharge+=p.d.elecCap;}allShips.push({ship,curBody:'kerbin',landed:true,dead:false,name:'Корабль-1',launchTime:0});activeShipIndex=0;mapCamX=0;mapCamY=0;}

let lastT=0;function loop(ts){let dt=Math.min((ts-lastT)/1000,.05);lastT=ts;handleInput(dt);if(mode==='flight'||mode==='map')physics(dt);if(mode==='flight'){renderFlight();updateTooltip();updateConsPanel();updateDockHUD();}else if(mode==='map')renderMap();if(mode==='build')renderBuild();if(mode!=='build'){updateHUD();updateShipsPanel();}requestAnimationFrame(loop);}
preset('light');resetFlight();requestAnimationFrame(loop);
</script>
</body>
</html>
